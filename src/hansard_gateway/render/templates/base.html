<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="{{ referrer }}">
  {% if robots %}<meta name="robots" content="{{ robots }}">{% endif %}
  <title>{% block title %}Singapore Hansard Gateway{% endblock %}</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 60rem;
           margin: 0 auto; padding: 1rem 1.5rem; line-height: 1.5; color: #1a1a1a; }
    h1 { font-size: 1.6rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; }
    dl dt { font-weight: bold; margin-top: 0.4rem; }
    article.speech { margin: 1rem 0; padding: 0.75rem 1rem; border-left: 3px solid #444;
                     background: #fafafa; }
    article.speech p { margin: 0.4rem 0; }
    footer { margin-top: 2rem; font-size: 0.9rem; color: #555; border-top: 1px solid #ddd;
             padding-top: 0.75rem; }
    code { background: #eee; padding: 0.1rem 0.3rem; }
    a { color: #0b3d91; }
    {% if token %}
    nav.global-nav { margin: 0.5rem 0 1rem; font-size: 0.9rem; }
    nav.global-nav.bottom { margin-top: 1.5rem; }
    span.u { font-size: 0.65rem; color: #8a8178; word-break: break-all; display: inline; }
    article.speech { position: relative; }
    article.speech:target { background: #fff3b0; border-left-color: #b8860b; }
    article.speech:target::after { content: "Cited passage"; position: absolute;
                                   top: 0.25rem; right: 0.5rem; font-size: 0.65rem;
                                   letter-spacing: 0.12em; text-transform: uppercase;
                                   color: #b8860b; }
    .cite { margin: 0.2rem 0 0; font-size: 0.75rem; color: #8a8178; }
    .cite a { color: #8a8178; }
    .cite-note { font-size: 0.85rem; color: #8a8178; }
    {% endif %}
  </style>
</head>
<body>
  <main>
    {% block nav_top %}{% if token %}{% include "nav_bar.html" %}{% endif %}{% endblock %}
    {% block content %}{% endblock %}
    {% block nav_bottom %}{% if token %}{% include "nav_bar.html" %}{% endif %}{% endblock %}
  </main>
</body>
</html>
