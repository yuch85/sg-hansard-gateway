<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="{{ referrer }}">
  {% if robots %}<meta name="robots" content="{{ robots }}">{% endif %}
  <title>{% block title %}Singapore Hansard Gateway{% endblock %}</title>
  <style>
/* a8 wireframe system (newspaper-warm). Trimmed to the 2 KB linter budget
   (PAGE_BUDGET_CSS_BYTES, summed over ALL <style> blocks per page; trims
   list in 27.3-03-SUMMARY). NEVER trimmed: .u visibility (screen+print),
   the gold :target state, the sticky .sp-head persistent-speaker row. */
:root{--p:#f7f4ee;--i:#1a1a1a;--t:#9b3d2b;--m:#8a8178;--gb:#fff3b0;--ge:#b8860b;--c:#fbf9f4;--r:#ddd3c2}
body{font-family:Georgia,serif;background:var(--p);color:var(--i);margin:0;font-size:1rem;line-height:1.55}
main{max-width:78rem;margin:0 auto;padding:0 1.5rem 2rem;display:grid;grid-template-columns:17rem minmax(0,1fr);gap:2.5rem;align-items:start}
main>*{grid-column:2;min-width:0}
h1{font-size:1.75rem}
h2{font-size:1.3rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:.15rem 1rem}
dl dt{font-weight:700;margin-top:.35rem}
dl dd{margin:0}
a{color:var(--t)}
code{font-family:monospace;font-size:.85em;background:#efe9dc;padding:.05rem .3rem}
nav.global-nav{grid-column:1/-1;font-size:.85rem;color:var(--m);padding:.35rem 0;margin-bottom:1.25rem}
nav.global-nav.bottom{margin-top:2.5rem}
nav.global-nav a{color:var(--m)}
nav.page-nav{font-size:.9rem;color:var(--m);margin:0 0 1.5rem;padding:.5rem 0}
nav.page-nav p{margin:.2rem 0}
.masthead{margin-bottom:1.25rem}
.masthead .byline{font-style:italic;color:#4c463d;margin:0;font-size:.95rem}
.masthead .rule{border:0;border-top:3px double var(--r);margin:.75rem 0 0}
nav.toc{grid-column:1;position:sticky;top:.75rem;max-height:calc(100vh - 1.5rem);overflow-y:auto;font-size:.85rem;background:var(--c);border:1px solid var(--r);padding:.75rem .9rem .9rem}
nav.toc h2{font-size:.7rem;text-transform:uppercase;color:var(--m);margin:0 0 .5rem}
nav.toc ol{list-style:none;margin:0;padding:0}
nav.toc li{margin:0 0 .55rem;line-height:1.35}
nav.toc .toc-turn{font-size:.7rem;color:var(--m);display:inline-block;min-width:1.4rem}
nav.toc .toc-first{display:block;font-size:.72rem;color:var(--m);font-style:italic;margin:0 0 0 1.9rem;max-width:15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.toc a{color:var(--i)}
nav.toc li.toc-speaker a{color:var(--m);font-weight:400;font-size:.8rem}
nav.toc li.toc-procedural a{color:var(--m);font-size:.75rem}
section#transcript>h2{font-size:1.1rem;text-transform:uppercase;color:var(--t);border-bottom:2px solid var(--t);padding-bottom:.3rem;margin:1.75rem 0 .5rem}
article.speech{position:relative;margin:0 0 .5rem;padding:0 0 1.4rem 3.2rem}
article.speech>.sp-head{position:sticky;top:0;z-index:5;background:var(--p);padding:.55rem 0 .45rem;margin-bottom:.25rem}
.turn{position:absolute;left:-3.2rem;top:.7rem;font-size:.75rem;color:var(--m);width:2.6rem;text-align:right}
h3{margin:0;font-size:1.02rem}
article.speech.mp h3{color:var(--t);font-weight:700;font-variant:small-caps}
article.speech.mp>.sp-head{border-bottom:1px solid var(--r)}
article.speech.speaker h3{color:#4c463d;font-weight:600;font-size:.95rem}
article.speech.procedural h3{color:var(--m);font-weight:400;font-size:.88rem;font-style:italic}
article.speech.procedural p{color:#5d574d;font-size:.95rem}
article.speech p{margin:.55rem 0}
.provenance{margin-top:2rem;padding:.9rem 1.1rem;background:var(--c);border:1px solid var(--r);font-size:.8rem;color:#5d574d}
.provenance h2{font-size:.7rem;text-transform:uppercase;color:var(--m);margin:0 0 .5rem}
.provenance dt{font-weight:700;color:#4c463d}
footer{margin-top:2rem;font-size:.9rem;color:#5d574d;border-top:3px double var(--r);padding-top:.75rem}
footer p{margin:.35rem 0}
@media (max-width:62rem){
main{grid-template-columns:1fr}
main>*{grid-column:1}
nav.toc{position:static;max-height:none}
nav.toc ol{display:grid;grid-template-columns:1fr 1fr;gap:0 1.5rem}
article.speech{padding-left:0}
span.u{display:inline-block;white-space:nowrap;overflow-x:auto;line-height:1.15;vertical-align:bottom;margin-top:.15rem;max-height:1.3em}
/* F4b (260921): nav .u WRAPS (clip overflowed the viewport pre-transcript). */
nav.global-nav span.u,nav.page-nav span.u,dd span.u{display:inline;white-space:normal;overflow:visible;max-height:none;margin-top:0;word-break:break-all}
/* F2: 17px root + 0.83rem (14.11px) floor — no element below 14px at phone width */
html{font-size:106.25%}
nav.toc h2{font-size:1rem}
nav.toc .toc-turn{font-size:1rem}
nav.toc .toc-first{font-size:.83rem}
nav.toc li.toc-speaker a{font-size:.83rem}
nav.toc li.toc-procedural a{font-size:.83rem}
.turn{font-size:.83rem}
.provenance{font-size:.83rem}
.provenance h2{font-size:1rem}
.refine h2{font-size:1rem}
.narrow-further h2{font-size:1rem}
.cite,.cite a{font-size:.83rem}
article.speech p{font-size:.83rem}
article.speech:target::after{font-size:.83rem}
span.u{font-size:.83rem}
code{font-size:1rem}
small{font-size:1rem}
}
@media print{
body{background:#fff;font-size:10.5pt}
nav.global-nav,nav.page-nav,nav.toc,.cite{display:none}
main{display:block;max-width:none;padding:0}
main>*{grid-column:auto}
article.speech{break-inside:avoid-page;padding:0 0 .6rem 0}
article.speech>.sp-head{position:static;background:#fff;padding-top:0}
.turn{position:static;display:inline;width:auto}
span.u{font-size:7.5pt;color:#666}
a{color:#000}
article.speech:target{background:var(--gb)}
}
{% if token %}
span.u {color:var(--m);word-break:break-all;margin-left:.4rem;vertical-align:baseline}
.cite{margin:.2rem 0 0;font-size:.75rem;color:var(--m)}
.cite a{color:var(--m)}
.cite a:hover{color:var(--ge)}
.cite-note{font-size:.85rem;color:var(--m);font-style:italic;margin:.25rem 0 1rem}
article.speech:target{background:var(--gb);box-shadow:inset 3px 0 0 var(--ge);padding-left:calc(3.2rem + 3px)}
article.speech:target::after{content:"Cited passage";position:absolute;top:0;right:.5rem;font-size:.65rem;text-transform:uppercase;color:var(--ge)}
@media (max-width:62rem){
article.speech:target{padding-left:3px}
/* F1: de-occlude the :target highlight (copilot pass-1 Major 3+4).
   --sp-head-clear = ceil(H_max/17)+1 rem, from the v0.1.4 container
   measurement (all fourteen .sp-heads at phone width: the page max,
   one hundred sixty pixels — the recon's single-element reading was not
   the max). 11rem = one hundred eighty-seven pixels, which clears it. */
:root{--sp-head-clear:11rem}
article.speech{scroll-margin-top:var(--sp-head-clear)}
article.speech:target{background:#ffe97d;box-shadow:inset 4px 0 0 var(--ge)}
article.speech:target::after{top:calc(var(--sp-head-clear) + .5rem)}
}
{% endif %}
/* Wave-3 layout system (27.3-04): 2-col search + refine panel, card grids,
   A-Z ladder, sticky narrow-further band. LAYOUT-ONLY — machine surface
   unchanged; no added overflow (sticky-safe). */
.search-layout{display:grid;grid-template-columns:minmax(0,1fr) 16rem;gap:2rem;align-items:start}
.search-results{display:grid;gap:1rem}
.search-result{background:var(--c);border:1px solid var(--r);padding:.9rem 1.1rem .95rem}
.search-result h2{margin:0 0 .5rem;font-size:1.12rem}
.search-result h2 .u{display:block;margin:.15rem 0 0}
.search-result .excerpt{color:#5d574d;font-size:.95rem}
.refine{background:var(--c);border:1px solid var(--r);padding:.9rem 1.1rem .95rem;position:sticky;top:.75rem;max-height:calc(100vh - 1.5rem)}
.refine h2{font-size:.7rem;text-transform:uppercase;color:var(--m);margin:0 0 .5rem}
.refine ul{list-style:none;margin:0 0 1.1rem;padding:0}
.refine li{margin:0 0 .5rem;line-height:1.4}
.pager{display:flex;flex-wrap:wrap;gap:.15rem .4rem}
.pager li{margin:0}
.letter-grid{columns:2;column-gap:2rem;list-style:none;padding:0}
.letter-grid li{margin:0 0 .5rem;break-inside:avoid}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.9rem;list-style:none;padding:0}
.card-grid li{background:var(--c);border:1px solid var(--r);padding:.6rem .8rem;margin:0}
.card-grid dl{margin:.3rem 0 0}
.term-columns{columns:2;column-gap:2rem}
.term-columns li{break-inside:avoid}
.narrow-further{position:sticky;top:.5rem;background:var(--c);border:1px solid var(--r);padding:.6rem .9rem;z-index:4}
.narrow-further h2{font-size:.7rem;text-transform:uppercase;color:var(--m);margin:0 0 .4rem}
@media (max-width:62rem){
.search-layout{grid-template-columns:1fr}
.refine{position:static;max-height:none;order:2}
}
  </style>
</head>
<body>
  <main>
    {% block nav_top %}{% if token %}{% include "nav_bar.html" %}{% endif %}{% endblock %}
    {% block content %}{% endblock %}
    {% block nav_bottom %}{% if token %}{% include "nav_bar.html" %}{% endif %}{% endblock %}
  </main>
</body>
</html>
