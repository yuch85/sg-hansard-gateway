[project]
name = "sg-hansard-gateway"
version = "0.1.0"
license = "Apache-2.0"
description = "FastAPI gateway proxying Singapore Parliamentary Hansard (SPRS + Pair) behind revocable capability tokens"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "jinja2",
    "cachetools",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.scripts]
#: One-command token admin CLI (27.2-REQ-07): `uv run hg-tokens …` in the repo
#: and `docker exec <container> hg-tokens …` in the image.
hg-tokens = "hansard_gateway.manage_tokens:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hansard_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
#: The live-acceptance suite (live_acceptance/) holds live production
#: credentials and is gitignored — never collect it by default (27.2-REQ-01).
testpaths = ["tests"]
addopts = "-m 'not live'"
#: Skip the untracked prior-art reference/ clones (7 collection errors without
#: this — they are third-party projects, not part of the suite).
norecursedirs = ["reference"]
markers = [
    "live: tests that hit the real upstream (deselected by default)",
]
